services:
  - type: web
    name: bloodhub
    env: node
    plan: free
    # Build frontend deps in nested folder
    buildCommand: cd AI-Based-Emergency-Blood-Availability-System-main && npm install
    # Start the backend so the service binds to Render's $PORT (backend reads process.env.PORT)
    startCommand: cd AI-Based-Emergency-Blood-Availability-System-main/backend && npm start
    envVars: []
